name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://naquela:naquela@localhost:5432/naquela_mesa
      BETTER_AUTH_SECRET: ci-secret-with-at-least-thirty-two-characters
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:int

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: naquela
          POSTGRES_PASSWORD: naquela
          POSTGRES_DB: naquela_mesa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naquela"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://naquela:naquela@localhost:5432/naquela_mesa
      BETTER_AUTH_SECRET: ci-secret-with-at-least-thirty-two-characters
      BETTER_AUTH_URL: http://localhost:3000
      E2E_ADMIN_EMAIL: e2e-admin@naquelamesa.test
      E2E_ADMIN_PASSWORD: e2e-senha-123
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run admin:ensure -- "$E2E_ADMIN_EMAIL" "$E2E_ADMIN_PASSWORD" "E2E Admin"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
